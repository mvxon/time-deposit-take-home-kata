name: Java CI

on:
  push:
    paths:
      - 'java/**'
      - '.github/workflows/java-ci.yml'
  pull_request:
    paths:
      - 'java/**'
      - '.github/workflows/java-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: java/pom.xml

      - name: Build, test, check coverage and code style
        run: ./mvnw -B -ntp verify

      - name: Publish coverage summary
        if: always() && hashFiles('java/target/site/jacoco/jacoco.csv') != ''
        run: |
          awk -F, 'NR > 1 { missed += $8; covered += $9 }
                   END { printf "### Line coverage: %.1f%% (%d of %d lines)\n", 100 * covered / (missed + covered), covered, missed + covered }' \
            target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('java/target/site/jacoco/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: java/target/site/jacoco

      - name: Build Docker image
        run: docker build -t time-deposit:ci .

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: java/target/surefire-reports
